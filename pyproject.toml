[project]
name = "injector"
version = "0.1.0"
description = "PyRIT-based prompt injection and jailbreak tester for small/open-source LLMs"
requires-python = ">=3.10"
dependencies = [
    "pyrit",
    "openai>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
injector = "injector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
